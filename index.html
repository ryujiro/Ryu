<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Pocket Walk</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#141824;--panel2:#0f1320;--text:#f6f7fb;--muted:#9aa4b2;--line:#263044;--good:#55d98a;--warn:#f2c14e;--bad:#ff6b6b;--accent:#7aa2ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}.wrap{width:min(760px,100%);margin:auto}h1{margin:20px 0 6px;font-size:clamp(30px,9vw,46px);letter-spacing:-.04em}.sub{color:var(--muted);margin:0 0 18px;line-height:1.5}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}.hero{background:linear-gradient(180deg,#171c29,#111520)}.statusline{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--muted);font-size:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:7px}.dot.on{background:var(--good);box-shadow:0 0 0 5px #55d98a1d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:17px;min-height:145px;display:flex;flex-direction:column;justify-content:space-between}.label{font-size:14px;color:var(--muted)}.value{font-size:clamp(44px,13vw,76px);font-weight:760;letter-spacing:-.06em;line-height:1}.unit{font-size:18px;color:var(--muted);font-weight:600}.bar{height:10px;background:#20283a;border-radius:99px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .12s linear}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}button{border:0;border-radius:16px;min-height:56px;padding:0 14px;font-size:17px;font-weight:750;background:#f5f7ff;color:#10131a}button.secondary{background:#20283a;color:white;border:1px solid #34405a}button:disabled{opacity:.45}.panel{margin-top:14px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff10}.row:last-child{border-bottom:0}.row span:first-child{color:var(--muted)}.tip{margin-top:14px;padding:14px 16px;border-radius:16px;background:#111827;border:1px solid #263452;color:#cdd6e5;line-height:1.55;font-size:14px}.good{color:var(--good)!important}.warn{color:var(--warn)!important}.bad{color:var(--bad)!important}@media(max-width:540px){.grid,.buttons{grid-template-columns:1fr}.big{min-height:130px}}
</style>
</head>
<body><main class="wrap">
<h1>Pocket Walk</h1><p class="sub">iPhoneをズボンの前ポケットに入れるだけのVR歩行センサー。</p>
<section class="hero">
<div class="statusline"><div><span id="dot" class="dot"></span><span id="sensorStatus">未開始</span></div><strong id="walkState">STOP</strong></div>
<div class="grid">
<div class="big"><div class="label">歩行速度</div><div id="speed" class="value">0.00</div><div class="bar"><i id="speedBar"></i></div></div>
<div class="big"><div class="label">身体方向</div><div><span id="direction" class="value">0</span><span class="unit">°</span></div><div class="label">正面からの相対角度</div></div>
</div>
<div class="buttons"><button id="startBtn">センサー開始</button><button id="frontBtn" class="secondary" disabled>今の向きを正面にする</button></div>
</section>
<section class="panel">
<div class="row"><span>現在方位</span><strong><span id="heading">--</span>°</strong></div>
<div class="row"><span>足踏み周期</span><strong><span id="cadence">0.00</span> Hz</strong></div>
<div class="row"><span>動的加速度</span><strong><span id="motion">0.00</span> m/s²</strong></div>
<div class="row"><span>検出ピーク</span><strong><span id="peak">0.00</span> m/s²</strong></div>
<div class="row"><span>コンパス精度</span><strong id="accuracy">--</strong></div>
</section>
<div id="message" class="tip">① センサー開始 → ② 正面設定 → ③ iPhoneを前ポケットへ → ④ その場で足踏み。</div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),S={heading:null,accuracy:null,zero:null,g:9.81,dyn:0,peak:0,last:0,ints:[],hz:0,target:0,speed:0,armed:true};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),wrap=d=>((d+540)%360)-180;function msg(t,c=''){$('message').className='tip '+c;$('message').textContent=t}function headingUI(){if(S.heading==null)return;$('heading').textContent=S.heading.toFixed(0);if(S.zero!=null){const r=wrap(S.heading-S.zero);$('direction').textContent=(r>=0?'+':'')+r.toFixed(0)}}function orientation(e){let h=null;if(typeof e.webkitCompassHeading==='number'&&isFinite(e.webkitCompassHeading)){h=e.webkitCompassHeading;if(typeof e.webkitCompassAccuracy==='number')S.accuracy=e.webkitCompassAccuracy}else if(typeof e.alpha==='number')h=(360-e.alpha)%360;if(h!=null){S.heading=(h+360)%360;headingUI();if(S.accuracy!=null){const a=Math.abs(S.accuracy);$('accuracy').textContent=a.toFixed(0)+'°';$('accuracy').className=a<=20?'good':a<=40?'warn':'bad'}}}function step(now,p){const dt=now-S.last;if(S.last>0&&dt>=300&&dt<=1800){S.ints.push(dt);if(S.ints.length>5)S.ints.shift();const avg=S.ints.reduce((a,b)=>a+b,0)/S.ints.length;S.hz=1000/avg;const c=clamp((S.hz-.45)/1.2,0,1),i=clamp((p-1.2)/3.8,0,1);S.target=clamp(.18+c*.70+i*.12,0,1)}else if(S.last===0)S.target=.28;S.last=now}function motion(e){const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;const x=Number(a.x||0),y=Number(a.y||0),z=Number(a.z||0),m=Math.sqrt(x*x+y*y+z*z);S.g=S.g*.94+m*.06;const d=Math.abs(m-S.g);S.dyn=S.dyn*.72+d*.28;S.peak=Math.max(S.peak*.92,S.dyn);const now=performance.now();if(S.armed&&S.dyn>1.35&&now-S.last>300){step(now,S.dyn);S.armed=false}else if(!S.armed&&S.dyn<.55)S.armed=true;$('motion').textContent=S.dyn.toFixed(2);$('peak').textContent=S.peak.toFixed(2)}function loop(){const now=performance.now(),since=now-S.last;if(S.last===0||since>1100){S.target=0;if(since>1800){S.hz=0;S.ints=[]}}const k=S.target>S.speed?.22:.10;S.speed+=(S.target-S.speed)*k;if(S.speed<.015)S.speed=0;$('speed').textContent=S.speed.toFixed(2);$('speedBar').style.width=(S.speed*100).toFixed(0)+'%';$('cadence').textContent=S.hz.toFixed(2);$('walkState').textContent=S.speed>.72?'RUN':S.speed>.06?'WALK':'STOP';$('walkState').className=S.speed>.06?'good':'';requestAnimationFrame(loop)}async function start(){try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){if(await DeviceMotionEvent.requestPermission()!=='granted')throw Error('モーションセンサーが許可されませんでした')}if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){let p;try{p=await DeviceOrientationEvent.requestPermission(true)}catch(_){p=await DeviceOrientationEvent.requestPermission()}if(p!=='granted')throw Error('方位センサーが許可されませんでした')}addEventListener('devicemotion',motion,{passive:true});addEventListener('deviceorientation',orientation,{passive:true});addEventListener('deviceorientationabsolute',orientation,{passive:true});$('dot').classList.add('on');$('sensorStatus').textContent='センサー動作中';$('frontBtn').disabled=false;$('startBtn').disabled=true;msg('センサー開始OK。正面を向いて「今の向きを正面にする」を押してください。','good')}catch(e){$('sensorStatus').textContent='開始できません';msg((e.message||e)+'。Safariで開き、センサーを許可してください。','bad')}}$('startBtn').onclick=start;$('frontBtn').onclick=()=>{if(S.heading==null)return msg('まだ方位を取得できません。iPhoneを少し動かして再度押してください。','warn');S.zero=S.heading;headingUI();msg('正面を0°に設定しました。前ポケットに入れて足踏みしてください。','good')};if(!('DeviceMotionEvent'in window)){$('startBtn').disabled=true;msg('このブラウザではモーションセンサーAPIを利用できません。iPhoneのSafariで開いてください。','bad')}loop()})();
</script></body></html>

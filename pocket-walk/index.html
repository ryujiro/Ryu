<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Pocket Walk MVP</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#141824;--panel2:#0f1320;--text:#f6f7fb;--muted:#9aa4b2;--line:#263044;--good:#55d98a;--warn:#f2c14e;--bad:#ff6b6b;--accent:#7aa2ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif}body{padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px);overflow-x:hidden}.wrap{width:min(760px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}.brand{display:flex;align-items:baseline;gap:8px}.brand h1{margin:0;font-size:24px;letter-spacing:-.04em}.brand small{color:var(--muted);font-size:11px}.status-line{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111520;border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin-bottom:7px}.status{font-size:12px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:0}.dot.on{background:var(--good);box-shadow:0 0 0 4px #55d98a1c}.cal-mini{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}.cal-mini strong{font-size:12px}.dashboard{display:grid;grid-template-columns:1.05fr .95fr .9fr;gap:7px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:106px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.label{color:var(--muted);font-size:11px}.value{font-size:clamp(36px,10vw,54px);font-weight:800;letter-spacing:-.06em;line-height:.95}.steps-value{font-size:clamp(38px,11vw,58px);font-weight:800;letter-spacing:-.05em;line-height:.95}.unit{font-size:13px;color:var(--muted);font-weight:650}.bar{height:6px;background:#20283a;border-radius:999px;overflow:hidden;margin-top:6px}.bar>i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:inherit;transition:width .1s linear}.panel{margin-top:7px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:7px}.data-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px 8px}.cell{min-width:0;padding:7px 4px;border-bottom:1px solid #ffffff0d}.cell:nth-last-child(-n+3){border-bottom:0}.cell .k{display:block;color:var(--muted);font-size:10px;line-height:1.15;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell strong{font-size:15px;white-space:nowrap}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}button{appearance:none;border:0;border-radius:13px;min-height:44px;padding:0 8px;font-size:13px;font-weight:750;background:#f5f7ff;color:#10131a}button.secondary{background:#20283a;color:#fff;border:1px solid #34405a}button:disabled{opacity:.45}.tip{margin-top:7px;padding:8px 10px;border-radius:12px;background:#111827;border:1px solid #263452;color:#cdd6e5;line-height:1.3;font-size:10px;min-height:31px}.warn{color:var(--warn)}.good{color:var(--good)}.bad{color:var(--bad)}details{margin-top:6px}.small{color:var(--muted);font-size:11px;line-height:1.45}summary{font-size:11px;color:#cbd5e1;cursor:pointer}@media(max-width:540px){body{height:100dvh;min-height:100dvh}.wrap{max-width:430px}.brand small,details{display:none}.dashboard{grid-template-columns:1fr 1fr 1fr}.metric{min-height:98px;padding:9px 8px}.value{font-size:clamp(34px,10.5vw,46px)}.steps-value{font-size:clamp(36px,11vw,50px)}.panel{padding:5px 7px}.cell{padding:6px 2px}.cell .k{font-size:9px}.cell strong{font-size:14px}.buttons{gap:6px}button{min-height:42px;font-size:12px}.tip{font-size:9px;padding:6px 8px;min-height:27px}}@media(max-height:700px){.top{margin-bottom:4px}.status-line{margin-bottom:4px;padding:5px 8px}.metric{min-height:88px}.panel,.buttons,.tip{margin-top:4px}.cell{padding:4px 2px}button{min-height:38px}.tip{display:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand"><h1>Pocket Walk</h1><small>VR歩行センサー</small></div><div id="walkState" class="status">STOP</div></div>
<div class="status-line"><div class="status"><span id="dot" class="dot"></span><span id="sensorStatus">未開始</span></div><div class="cal-mini">CAL <strong id="calStatus">未実施</strong></div></div>

<section class="dashboard">
<div class="metric"><div class="label">歩行速度</div><div><span id="speed" class="value">0.00</span></div><div class="bar"><i id="speedBar"></i></div></div>
<div class="metric"><div class="label">身体方向</div><div><span id="direction" class="value">0</span><span class="unit">°</span></div><div class="label">相対角度</div></div>
<div class="metric"><div class="label">歩数</div><div><span id="steps" class="steps-value">0</span><span class="unit">歩</span></div><div class="label">検出合計</div></div>
</section>

<section class="panel"><div class="data-grid">
<div class="cell"><span class="k">現在周期</span><strong><span id="cadence">0.00</span> Hz</strong></div>
<div class="cell"><span class="k">基準周期</span><strong><span id="baseCadence">--</span> Hz</strong></div>
<div class="cell"><span class="k">動的加速度</span><strong><span id="motion">0.00</span></strong></div>
<div class="cell"><span class="k">検出ピーク</span><strong><span id="peak">0.00</span></strong></div>
<div class="cell"><span class="k">現在方位</span><strong><span id="heading">--</span>°</strong></div>
<div class="cell"><span class="k">コンパス精度</span><strong id="accuracy">--</strong></div>
</div></section>

<div class="buttons">
<button id="startBtn">センサー開始</button>
<button id="calBtn" class="secondary" disabled>音声キャリブレーション</button>
<button id="frontBtn" class="secondary" disabled>正面を設定</button>
<button id="resetStepsBtn" class="secondary">歩数リセット</button>
</div>
<div id="message" class="tip">センサー開始 → 音声キャリブレーション → ポケットへ。画面を見なくても音声で進みます。</div>
<details><summary>キャリブレーションについて</summary><div class="small">立った状態を3秒、普通の速さの足踏みを8秒測定します。速度は2歩で素早く仮判定し、3歩で補正して安定させます。</div></details>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap180=d=>((d+540)%360)-180;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const percentile=(arr,p)=>{if(!arr.length)return 0;const a=[...arr].sort((x,y)=>x-y);const i=Math.min(a.length-1,Math.max(0,Math.floor((a.length-1)*p)));return a[i]};
const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
const s={heading:null,headingAccuracy:null,zeroHeading:null,gravityMag:9.81,dyn:0,peak:0,lastStepMs:0,lastIntervals:[],lastPeaks:[],cadenceHz:0,targetSpeed:0,speed:0,stepCount:0,armed:true,started:false,calibrating:false,calPhase:null,calSamples:[],thresholdHigh:1.35,thresholdLow:.55,normalCadenceHz:1.0,walkPeakRef:2.5,calibrated:false};
function msg(t,k=""){$("message").className="tip "+k;$("message").textContent=t}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.95;u.pitch=1;const voices=speechSynthesis.getVoices();const ja=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ja"));if(ja)u.voice=ja;speechSynthesis.speak(u)}catch(_){}}
function showBaseCadence(){$("baseCadence").textContent=s.calibrated?s.normalCadenceHz.toFixed(2):"--"}
function loadCal(){try{const c=JSON.parse(localStorage.getItem("pocketWalkCalibration")||"null");if(!c)return;s.thresholdHigh=c.thresholdHigh||1.35;s.thresholdLow=c.thresholdLow||.55;s.normalCadenceHz=c.normalCadenceHz||1.0;s.walkPeakRef=c.walkPeakRef||2.5;s.calibrated=true;$("calStatus").textContent="保存済み";$("calStatus").className="good";showBaseCadence()}catch(_){}}
function saveCal(){localStorage.setItem("pocketWalkCalibration",JSON.stringify({thresholdHigh:s.thresholdHigh,thresholdLow:s.thresholdLow,normalCadenceHz:s.normalCadenceHz,walkPeakRef:s.walkPeakRef,updatedAt:Date.now()}))}
function resetWalk(){s.lastStepMs=0;s.lastIntervals=[];s.lastPeaks=[];s.cadenceHz=0;s.targetSpeed=0;s.speed=0;s.armed=true}
function updateSteps(){$("steps").textContent=String(s.stepCount)}
function updateHeading(){if(s.heading==null)return;$("heading").textContent=s.heading.toFixed(0);if(s.zeroHeading!=null){const r=wrap180(s.heading-s.zeroHeading);$("direction").textContent=(r>=0?"+":"")+r.toFixed(0)}}
function onOrientation(e){let h=null;if(typeof e.webkitCompassHeading==="number"&&isFinite(e.webkitCompassHeading)){h=e.webkitCompassHeading;if(typeof e.webkitCompassAccuracy==="number")s.headingAccuracy=e.webkitCompassAccuracy}else if(typeof e.alpha==="number")h=(360-e.alpha)%360;if(h!=null){s.heading=(h+360)%360;updateHeading();if(s.headingAccuracy!=null){const a=Math.abs(s.headingAccuracy);$("accuracy").textContent=a.toFixed(0)+"°";$("accuracy").className=a<=20?"good":a<=40?"warn":"bad"}}}
function speedFrom(cadence,peak){if(s.calibrated){const cr=clamp(cadence/Math.max(.35,s.normalCadenceHz),.50,1.80);const ir=clamp(peak/Math.max(.5,s.walkPeakRef),.55,1.80);return clamp(.50*cr+.30*(ir-1),.15,1)}const c=clamp((cadence-.45)/(1.65-.45),0,1),i=clamp((peak-1.2)/3.0,0,1);return clamp(.15+c*.62+i*.23,0,1)}
function step(now,p){s.stepCount++;updateSteps();const dt=now-s.lastStepMs;s.lastPeaks.push(p);if(s.lastPeaks.length>3)s.lastPeaks.shift();if(s.lastStepMs>0&&dt>=300&&dt<=1800){s.lastIntervals.push(dt);if(s.lastIntervals.length>2)s.lastIntervals.shift();const fastCadence=1000/dt;const fastPeak=avg(s.lastPeaks.slice(-2));const fastSpeed=speedFrom(fastCadence,fastPeak);if(s.lastIntervals.length>=2&&s.lastPeaks.length>=3){const stableCadence=2000/(s.lastIntervals[s.lastIntervals.length-1]+s.lastIntervals[s.lastIntervals.length-2]);const stablePeak=avg(s.lastPeaks.slice(-3));const stableSpeed=speedFrom(stableCadence,stablePeak);s.cadenceHz=stableCadence;s.targetSpeed=clamp(fastSpeed*.70+stableSpeed*.30,0,1)}else{s.cadenceHz=fastCadence;s.targetSpeed=fastSpeed}}else if(s.lastStepMs===0)s.targetSpeed=s.calibrated?.30:.25;s.lastStepMs=now}
function onMotion(e){const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;const x=Number(a.x||0),y=Number(a.y||0),z=Number(a.z||0),m=Math.sqrt(x*x+y*y+z*z);s.gravityMag=s.gravityMag*.94+m*.06;const d=Math.abs(m-s.gravityMag);s.dyn=s.dyn*.72+d*.28;s.peak=Math.max(s.peak*.92,s.dyn);if(s.calibrating&&s.calPhase)s.calSamples.push({t:performance.now(),d:s.dyn});const now=performance.now();if(!s.calibrating){if(s.armed&&s.dyn>s.thresholdHigh&&now-s.lastStepMs>300){step(now,s.dyn);s.armed=false}else if(!s.armed&&s.dyn<s.thresholdLow)s.armed=true}$("motion").textContent=s.dyn.toFixed(2);$("peak").textContent=s.peak.toFixed(2)}
function estimateCadence(samples,th){let peaks=[],armed=true,last=0;for(const q of samples){if(armed&&q.d>th&&q.t-last>300){peaks.push(q.t);last=q.t;armed=false}else if(!armed&&q.d<th*.45)armed=true}if(peaks.length<3)return 1.0;const ints=[];for(let i=1;i<peaks.length;i++){const d=peaks[i]-peaks[i-1];if(d>=300&&d<=1800)ints.push(d)}if(!ints.length)return 1.0;return 1000/avg(ints)}
async function calibrate(){if(!s.started||s.calibrating)return;s.calibrating=true;$("calBtn").disabled=true;$("frontBtn").disabled=true;resetWalk();$("calStatus").textContent="準備中";$("calStatus").className="warn";msg("音声の指示に従ってください。","warn");speak("キャリブレーションを開始します。スマホを前ポケットに入れて、正面を向いて立ってください。5秒後に静止測定を開始します。");await sleep(5000);s.calPhase="still";s.calSamples=[];$("calStatus").textContent="静止測定中";speak("静止測定を開始します。動かないでください。");await sleep(3000);const still=s.calSamples.map(x=>x.d);s.calPhase=null;const still95=percentile(still,.95);if(s.heading!=null)s.zeroHeading=s.heading;updateHeading();$("calStatus").textContent="歩行準備";speak("静止測定が終わりました。次は普通の速さで、その場で足踏みしてください。2秒後に測定を開始します。");await sleep(2000);s.calPhase="walk";s.calSamples=[];$("calStatus").textContent="歩行測定中";speak("歩行測定を開始します。普通の速さで足踏みしてください。");await sleep(8000);const walk=[...s.calSamples];s.calPhase=null;const walkVals=walk.map(x=>x.d);const walk85=percentile(walkVals,.85);const walk90=percentile(walkVals,.90);if(walkVals.length<20||walk85<=still95*1.25){s.calibrating=false;$("calBtn").disabled=false;$("frontBtn").disabled=false;$("calStatus").textContent="失敗";$("calStatus").className="bad";msg("歩行の揺れを十分に検出できませんでした。もう一度試してください。","bad");speak("歩行を十分に検出できませんでした。もう一度キャリブレーションしてください。");return}s.thresholdHigh=clamp(still95+(walk85-still95)*.45,.35,3.0);s.thresholdLow=clamp(Math.max(still95*1.15,s.thresholdHigh*.35),.12,s.thresholdHigh*.7);s.walkPeakRef=Math.max(.5,walk90);s.normalCadenceHz=clamp(estimateCadence(walk,s.thresholdHigh),.45,1.8);s.calibrated=true;saveCal();showBaseCadence();resetWalk();s.calibrating=false;$("calBtn").disabled=false;$("frontBtn").disabled=false;$("calStatus").textContent="完了";$("calStatus").className="good";msg("キャリブレーション完了。基準周期 "+s.normalCadenceHz.toFixed(2)+" Hz を保存しました。","good");speak("キャリブレーション完了です。基準周期を保存しました。使用できます。");}
function animate(){const since=performance.now()-s.lastStepMs;if(!s.calibrating&&(s.lastStepMs===0||since>1100)){s.targetSpeed=0;if(since>1800){s.cadenceHz=0;s.lastIntervals=[];s.lastPeaks=[]}}const k=s.targetSpeed>s.speed?.34:.12;s.speed+=(s.targetSpeed-s.speed)*k;if(s.speed<.015)s.speed=0;$("speed").textContent=s.speed.toFixed(2);$("speedBar").style.width=(s.speed*100).toFixed(0)+"%";$("cadence").textContent=s.cadenceHz.toFixed(2);$("walkState").textContent=s.speed>.75?"RUN":s.speed>.06?"WALK":"STOP";$("walkState").className="status "+(s.speed>.06?"good":"");requestAnimationFrame(animate)}
async function start(){try{if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){if(await DeviceMotionEvent.requestPermission()!=="granted")throw Error("モーションセンサーが許可されませんでした")}if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){let p;try{p=await DeviceOrientationEvent.requestPermission(true)}catch(_){p=await DeviceOrientationEvent.requestPermission()}if(p!=="granted")throw Error("方位センサーが許可されませんでした")}addEventListener("devicemotion",onMotion,{passive:true});addEventListener("deviceorientation",onOrientation,{passive:true});addEventListener("deviceorientationabsolute",onOrientation,{passive:true});s.started=true;$("dot").classList.add("on");$("sensorStatus").textContent="センサー動作中";$("frontBtn").disabled=false;$("calBtn").disabled=false;$("startBtn").disabled=true;msg("センサー開始OK。『音声キャリブレーション』を押してください。","good");speak("センサーを開始しました。音声キャリブレーションを押してください。")}catch(e){$("sensorStatus").textContent="開始できません";msg((e.message||e)+"。Safariで開き、センサー許可をONにしてください。","bad")}}
$("startBtn").onclick=start;
$("calBtn").onclick=calibrate;
$("resetStepsBtn").onclick=()=>{s.stepCount=0;updateSteps();msg("歩数を0にリセットしました。","good");speak("歩数をリセットしました。");};
$("frontBtn").onclick=()=>{if(s.heading==null){msg("まだ方位を取得できていません。iPhoneを少し動かしてから、もう一度押してください。","warn");speak("まだ方位を取得できていません。");return}s.zeroHeading=s.heading;updateHeading();msg("正面を0°に設定しました。","good");speak("正面を設定しました。");};
if(!("DeviceMotionEvent" in window)){$("startBtn").disabled=true;msg("このブラウザではモーションセンサーAPIを利用できません。iPhoneのSafariでHTTPSから開いてください。","bad")}
loadCal();showBaseCadence();updateSteps();animate();
})();
</script>
</body>
</html>
